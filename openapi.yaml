openapi: 3.1.0
info:
  title: イチカブ API
  version: 0.1.0
  description: |
    API契約の唯一の正。server は openapi-typescript、iOS は swift-openapi-generator で
    この定義から型を生成する（設計書 §8）。
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: ヘルスチェック
      operationId: getHealth
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/events:
    get:
      summary: イベント一覧
      operationId: listEvents
      description: |
        認証ユーザーの保有に対応するイベントを全件返す。絞り込みパラメータは持たない。
        月の絞り込みは iOS 側の表示処理の責任（イベント取得API設計書 §2）。

        登録したイベントに加え、保有銘柄の決算月から計算した権利付最終日を含む
        （権利確定日・配当落ち日の計算 設計書 §2）。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: |
            イベントの配列。ラッパーなし。startDate の昇順、同じ日は time の昇順
            （時刻なしは後ろ）、それも同じなら id の文字列としての昇順に並ぶ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          description: 認証なし。本文は返さない
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Event:
      type: object
      required:
        - id
        - kind
        - title
        - shortLabel
        - startDate
        - endDate
        - time
        - importance
        - note
        - source
      properties:
        id:
          type: string
          description: |
            イベントのID。表示側では並べ替えと一覧の識別にだけ使う不透明な文字列で、
            意味を読み取ってはならない。登録したイベントは行IDを文字列にしたもの（`12`）、
            計算した権利日は `rights-<銘柄ID>-<年>`（`rights-3-2026`）になる。
        kind:
          type: string
          enum:
            - market
            - theme
            - stock
          description: 種別。market は市場、theme はテーマ、stock は銘柄のイベント
        title:
          type: string
          description: シートに出す見出し
        shortLabel:
          type: string
          description: カレンダーのセルに出す略号
        startDate:
          type: string
          format: date
          description: 開始日
        endDate:
          type:
            - string
            - "null"
          format: date
          description: 終了日。null は単日
        time:
          type:
            - string
            - "null"
          description: 時刻（JST、HH:MM:SS）
        importance:
          type: integer
          minimum: 1
          maximum: 3
          description: 重要度。1（低）〜 3（高）
        note:
          type:
            - string
            - "null"
          description: シートに出す補足
        source:
          type:
            - object
            - "null"
          required:
            - name
            - url
          properties:
            name:
              type: string
              description: 画面に出す出典の名前（`内閣府（PDL1.0）` 等）
            url:
              type: string
              format: uri
              description: 出典のページ
          description: |
            この日付をどこで確認したか。出典の記載を条件とする出典を使うために、
            利用者に見える形で出す（全体設計書 §5.1）。名前とURLは必ず対で、
            片方だけの状態は無い。null は出典を出さないイベントを表し、
            計算で作る権利日のイベントは転記元が無いため常に null になる。
