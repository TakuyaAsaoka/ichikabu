openapi: 3.1.0
info:
  title: イチカブ API
  version: 0.1.0
  description: |
    パスとリクエスト・レスポンスの型の唯一の正。server は openapi-typescript、iOS は swift-openapi-generator で
    この定義から型を生成する（設計書 §8）。
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: ヘルスチェック
      operationId: getHealth
      responses:
        "200":
          description: 正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/events:
    get:
      summary: イベント一覧
      operationId: listEvents
      description: |
        有効なイベントを全件返す。絞り込みパラメータは持たない。誰が呼んでも同じ配列が返る。
        持ち株での絞り込みと月の絞り込みは iOS 側の表示処理の責任
        （イベント取得API設計書 §2、ログイン廃止 設計書 §5）。

        登録したイベントに加え、決算月が入っている銘柄すべてについて計算した
        権利付最終日を含む（権利確定日・配当落ち日の計算 設計書 §2）。

        認証は要らない。返すのは運用者が登録したイベントだけで、
        誰が何を持っているかは含まない（ログイン廃止 設計書 §5.1）。
      responses:
        "200":
          description: |
            イベントの配列。ラッパーなし。startDate の昇順、同じ日は time の昇順
            （時刻なしは後ろ）、それも同じなら id の文字列としての昇順に並ぶ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
  /api/stocks:
    get:
      summary: 銘柄一覧
      operationId: listStocks
      description: |
        登録されている銘柄を全件返す。絞り込みパラメータは持たない。

        認証は要らない。返すのは運用者が登録した銘柄の一覧だけで、
        誰が何を持っているかは含まない（ログイン廃止 設計書 §3.2）。
      responses:
        "200":
          description: |
            銘柄の配列。ラッパーなし。market の昇順、同じ市場は ticker の昇順に並ぶ。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stock"
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    EventTarget:
      oneOf:
        - $ref: "#/components/schemas/MarketTarget"
        - $ref: "#/components/schemas/ThemeTarget"
        - $ref: "#/components/schemas/StockTarget"
      discriminator:
        propertyName: type
        mapping:
          market: "#/components/schemas/MarketTarget"
          theme: "#/components/schemas/ThemeTarget"
          stock: "#/components/schemas/StockTarget"
      description: |
        このイベントが誰に出るかを決める対象。ちょうど1つを持つ（全体設計書 §5）。
        `type` で場合分けすると、市場・テーマ・銘柄それぞれの持ち物が取り出せる。
        `kind` と同じ区分だが、`kind` は色分けに使う区分で、こちらは表示対象の判定に使う。
    Market:
      type: string
      enum:
        - JP
        - US
      description: |
        銘柄が上場している市場。`EventMarket` から `GLOBAL` を除いたもの。
        片方に市場を足すときは、もう片方も見ること
    EventMarket:
      type: string
      enum:
        - JP
        - US
        - GLOBAL
      description: |
        市場イベントを出す相手。`GLOBAL` は全員に出し、
        `JP` と `US` はその市場の銘柄を1つでも持つ人に出す。
        `Market` に `GLOBAL` を足したもので、値の集合が違うため別の型になる。
        端末で `Stock.market` と比べるときは、文字列に直して比べる
    MarketTarget:
      type: object
      required:
        - type
        - market
      properties:
        type:
          type: string
          enum:
            - market
        market:
          $ref: "#/components/schemas/EventMarket"
    ThemeTarget:
      type: object
      required:
        - type
        - themeId
      properties:
        type:
          type: string
          enum:
            - theme
        themeId:
          type: integer
          description: |
            テーマのID。そのテーマに属する銘柄を1つでも持つ人に出す。
            どの銘柄がどのテーマに属するかは `GET /api/stocks` の `themeIds` で分かる。
    StockTarget:
      type: object
      required:
        - type
        - stockId
      properties:
        type:
          type: string
          enum:
            - stock
        stockId:
          type: integer
          description: 銘柄のID（`GET /api/stocks` の `id`）。その銘柄を持つ人に出す
    Event:
      type: object
      required:
        - id
        - kind
        - title
        - shortLabel
        - startDate
        - endDate
        - time
        - importance
        - note
        - source
        - target
      properties:
        id:
          type: string
          description: |
            イベントのID。表示側では並べ替えと一覧の識別にだけ使う不透明な文字列で、
            意味を読み取ってはならない。登録したイベントは行IDを文字列にしたもの（`12`）、
            計算した権利日は `rights-<銘柄ID>-<年>`（`rights-3-2026`）になる。
        kind:
          type: string
          enum:
            - market
            - theme
            - stock
          description: 種別。market は市場、theme はテーマ、stock は銘柄のイベント
        title:
          type: string
          description: シートに出す見出し
        shortLabel:
          type: string
          description: カレンダーのセルに出す略号
        startDate:
          type: string
          format: date
          description: 開始日
        endDate:
          type:
            - string
            - "null"
          format: date
          description: 終了日。null は単日
        time:
          type:
            - string
            - "null"
          description: 時刻（JST、HH:MM:SS）
        importance:
          type: integer
          minimum: 1
          maximum: 3
          description: 重要度。1（低）〜 3（高）
        note:
          type:
            - string
            - "null"
          description: シートに出す補足
        source:
          type:
            - object
            - "null"
          required:
            - name
            - url
          properties:
            name:
              type: string
              description: 画面に出す出典の名前（`内閣府（PDL1.0）` 等）
            url:
              type: string
              format: uri
              description: 出典のページ
          description: |
            この日付をどこで確認したか。出典の記載を条件とする出典を使うために、
            利用者に見える形で出す（全体設計書 §5.1）。名前とURLは必ず対で、
            片方だけの状態は無い。null は出典を出さないイベントを表し、
            計算で作る権利日のイベントは転記元が無いため常に null になる。
        target:
          $ref: "#/components/schemas/EventTarget"
    Stock:
      type: object
      required:
        - id
        - market
        - ticker
        - name
        - themeIds
      properties:
        id:
          type: integer
          description: 銘柄のID。`Event` の `StockTarget.stockId` と同じ値
        market:
          $ref: "#/components/schemas/Market"
        ticker:
          type: string
          description: ティッカー（`7203`・`NVDA` 等）
        name:
          type: string
          description: 銘柄名
        themeIds:
          type: array
          items:
            type: integer
          description: |
            この銘柄が属するテーマのIDの一覧。属していなければ空の配列。
            テーマイベントは、そのテーマに属する銘柄を1つでも持つ人に出すため、
            端末側の判定にこの一覧が要る（全体設計書 §5）。並び順は決めない。
            テーマの名前は返さない。テーマを画面に出す要件が無いため
