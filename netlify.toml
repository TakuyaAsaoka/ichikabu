# 配信の設定（Issue #74 設計書 §2）。手順は docs/guides/deploy.md
#
# **自動デプロイは画面で止める**（Build & deploy → Continuous deployment →
# Build status を Stopped builds）。このファイルには止める手立てが無い。
# 止めないと、push のたびに15クレジット減って月20回で無料枠（月300）が尽き、
# 枠切れでサイトが停止する

[build]
# pnpm はこの中だけで回す（リポジトリ構成は最上位の CLAUDE.md）。
# netlify.toml のパスはすべてこの起点からの相対になる
base = "server"
# `gen` は `../openapi.yaml` を読む。手元でビルドして配信するため、
# リポジトリ全体があり、この相対パスは解決できる
command = "pnpm gen && pnpm build"
# publish は書かない。Next.js は設定不要で、配信先の置き場所は
# アダプタ（OpenNext）が決める。書くと衝突する

[build.environment]
# package.json の engines は `>=20.12`。Netlify の既定に任せると、
# 向こうの既定が変わった日にビルドの結果が変わる
NODE_VERSION = "22"

# マイグレーションはここで流さない。ビルドに混ぜると、壊れたマイグレーションで
# サイトごと落ちる。手元から配信先のDBへ流す（docs/guides/deploy.md）
