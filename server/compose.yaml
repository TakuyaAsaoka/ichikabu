# 開発用の PostgreSQL。本番は Supabase 東京（設計書 §1.1）だが、ここは合わせに行かず
# その時点の安定版を使う。使っているのは PostgreSQL の標準機能（num_nonnulls・
# GENERATED ALWAYS AS IDENTITY）だけなので、本番を別のところへ移すことになっても
# pg_dump で足りる。
services:
  db:
    # ダイジェストまで書く。同じ 18.4 でも土台の debian:trixie-slim が上がると
    # 中の libc6 が変わり、日本語の並び順（照合順序）がコードを変えずに動く。
    # 上げるときは、次で出る Digest: の行を見て版とダイジェストの両方を書き換え、
    # docker compose up -d でコンテナを作り直す（作り直さないと古いままになる）
    #   docker buildx imagetools inspect postgres:<版>
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ichikabu
    ports:
      # 既定の 5432 は他プロジェクトのコンテナが使っているため 5434 を割り当てる。
      # 127.0.0.1 に限定し、LAN からは見えないようにする
      - "127.0.0.1:5434:5432"
    volumes:
      # postgres:18 のデータ配置は /var/lib/postgresql/18/docker であり、
      # ボリューム宣言は /var/lib/postgresql。ここを取り違えると永続化されない
      - pgdata:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
